name: Task
description: One unit of work for one owner role (docs/spec/03-workflow.md).
title: '<summary>'
body:
  - type: dropdown
    id: owner
    attributes:
      label: Owner role
      options:
        - supervisor
        - design-lead
        - frontend-engineer
        - app-data-engineer
        - platform-engineer
        - security-engineer
        - qa-engineer
        - reader-advocate
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What to do and why. Plain, short sentences.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist. Each item can be verified.
      placeholder: '- [ ] ...'
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: How the criteria are checked.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security notes
      description: Secrets, dependencies, workflows, user input, headers. Write "none" if not relevant.
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: Design notes
      description: Links to docs/design/ or docs/spec/07-design.md. Write "none" if not relevant.
    validations:
      required: true
