version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    # Majors are held back until the toolchain supports them (issue 15):
    # TypeScript 7 and ESLint 10 are blocked by @astrojs/check and the lint plugins.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-plugin-astro'
        update-types: ['version-update:semver-major']
    groups:
      npm-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - 'minor'
          - 'patch'
