name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0
        required: true
        type: string

permissions: read-all

concurrency:
  group: release
  cancel-in-progress: false

# The Supervisor publishes v0.N.0 at a gate: gh release create v0.N.0 --target main --generate-notes
# (docs/runbooks/releases.md). The sbom job builds and generates a CycloneDX SBOM with a read-only
# token; attach-sbom uploads it to the release (docs/spec/08-security.md 8.4).
jobs:
  sbom:
    name: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs third-party code (npm, npx). Read-only token, and no credentials on disk.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install (R-507)
        run: npm ci --ignore-scripts
      - name: Build site
        run: npm run build
      - name: Generate CycloneDX SBOM
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  attach-sbom:
    name: attach-sbom
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Write token, but no checkout and no third-party code: only gh CLI.
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
      - name: Attach SBOM to release
        run: gh release upload "$TAG" sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
