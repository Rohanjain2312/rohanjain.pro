name: pr-hygiene

# PR body, title, size, thresholds, dependencies and removed tests (R-104, R-108, R-109, R-404, R-506, R-701).
# Runs on pull_request, never pull_request_target. The script comes from the base commit of the PR, so a PR cannot
# weaken its own check. Until the script exists on main (this PR, #14), the step below falls back to the PR head copy.
# PR text (title, body, branch) is read by the script through the API and is never placed in a shell command.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, ready_for_review]

permissions: read-all

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-hygiene:
    name: pr-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Bootstrap fallback (only while the script is missing on the base branch)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f trusted/.github/scripts/pr-process.mjs ]; then
            echo "pr-process.mjs is not on the base branch yet. Using the PR head copy."
            git -C trusted fetch --depth=1 "https://github.com/$REPO" "$HEAD_SHA"
            git -C trusted checkout FETCH_HEAD -- .github/scripts/pr-process.mjs .github/labeler.json
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
      - name: PR hygiene (R-104, R-108, R-109, R-404, R-506, R-701)
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/pr-process.mjs pr-hygiene --pr "$PR_NUMBER"
