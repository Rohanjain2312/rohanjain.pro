name: Status

# Daily: checks each demo URL and the latest commit date of each featured repo, then writes status.json to the
# orphan branch status-data (F-10, ADR-0027, docs/spec/06-architecture.md 5.7). It never writes main and opens no PR.
# The Phase 7 deploy workflow copies the file into public/ before the build; nothing runs at request time.
# Job 1 (collect) is read-only and runs the script. Job 2 (publish) holds the only write permission, runs no repo
# code, validates the JSON shape, and makes one commit per run (always, so the check date stays fresh).
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  collect:
    name: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build status.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/status.mjs --out status.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status
          path: status.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status
          path: ${{ runner.temp }}/incoming
      - name: Validate the file
        env:
          INCOMING: ${{ runner.temp }}/incoming/status.json
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.env.INCOMING, "utf8"));
            const d = /^\d{4}-\d{2}-\d{2}$/;
            const ok = d.test(s.checkedAt) && d.test(s.lastUpdated) && Array.isArray(s.demos) &&
              s.demos.every((x) => /^https:\/\/huggingface\.co\/spaces\//.test(x.url) && typeof x.up === "boolean" && d.test(x.checkedAt));
            if (!ok) { console.error("status.json has an unexpected shape"); process.exit(1); }
          '
      - name: Commit to status-data
        env:
          INCOMING: ${{ runner.temp }}/incoming/status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin status-data > /dev/null; then
            git fetch --depth=1 origin status-data
            git switch --force -C status-data FETCH_HEAD
          else
            git switch --orphan status-data
          fi
          git rm -rq --ignore-unmatch . > /dev/null
          cp "$INCOMING" status.json
          git add status.json
          git commit -m "chore(status): daily status data" -m "Agent-Role: platform-engineer"
          git push origin status-data
