name: Status

# Daily: checks each demo URL and the latest commit date of each featured repo, then proposes public/status.json
# (F-10, docs/spec/06-architecture.md 5.7). The site reads the file at build time; nothing runs at request time.
# Job 1 (collect) is read-only and runs the script. Job 2 (propose) holds the only write permissions, runs no repo
# code, and only copies a validated JSON file onto a branch and opens a PR.
# Manual dispatch runs collect only unless "propose" is ticked.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      propose:
        description: Also open the status PR
        type: boolean
        default: false

permissions: read-all

concurrency:
  group: status
  cancel-in-progress: false

jobs:
  collect:
    name: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Build status.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/status.mjs --out status.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status
          path: status.json
          if-no-files-found: error
          retention-days: 1

  propose:
    name: propose
    needs: collect
    if: github.event_name == 'schedule' || inputs.propose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status
          path: incoming
      - name: Validate the file
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("incoming/status.json", "utf8"));
            const d = /^\d{4}-\d{2}-\d{2}$/;
            const ok = d.test(s.checkedAt) && d.test(s.lastUpdated) && Array.isArray(s.demos) &&
              s.demos.every((x) => /^https:\/\/huggingface\.co\/spaces\//.test(x.url) && typeof x.up === "boolean" && d.test(x.checkedAt));
            if (!ok) { console.error("status.json has an unexpected shape"); process.exit(1); }
          '
      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp incoming/status.json public/status.json
          if git diff --quiet -- public/status.json && [ -z "$(git ls-files --others --exclude-standard public/status.json)" ]; then
            echo "status.json unchanged. Nothing to propose."
            exit 0
          fi
          branch="platform/183-status-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add public/status.json
          git commit -m "chore(status): daily status data" -m "Agent-Role: platform-engineer"
          git push --force-with-lease origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "[platform-engineer] chore(status): daily status data (#183)" \
            --body "Daily update of public/status.json from .github/workflows/status.yml. Refs #183."
