name: branch-name

# Branch name is <role>/<issue>-<slug> (R-103).
# Runs on pull_request, never pull_request_target. The script comes from the base commit of the PR, so a PR cannot
# weaken its own check.
# PR text (title, body, branch) is read by the script through the API and is never placed in a shell command.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: read-all

concurrency:
  group: branch-name-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
      - name: Branch name (R-103)
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/pr-process.mjs branch-name --pr "$PR_NUMBER"
