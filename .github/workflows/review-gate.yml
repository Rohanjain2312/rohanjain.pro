name: review-gate

# Required reviews from labels and paths, in the run-review format (R-201, R-202, R-207, R-208, R-609).
# Post the review comment first, then add the approved:<role> label. The label event re-runs this check.
# Runs on pull_request, never pull_request_target. The script comes from the base commit of the PR, so a PR cannot
# weaken its own check.
# PR text (title, body, branch) is read by the script through the API and is never placed in a shell command.
on:
  pull_request:
    types:
      [
        opened,
        reopened,
        synchronize,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
      ]

permissions: read-all

concurrency:
  group: review-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-gate:
    name: review-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: trusted/.nvmrc
      - name: Review gate (R-201, R-202, R-207, R-208, R-609)
        working-directory: trusted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/pr-process.mjs review-gate --pr "$PR_NUMBER"
